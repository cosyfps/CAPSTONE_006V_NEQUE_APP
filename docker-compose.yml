# Levanta Ñeque en local: front en http://localhost:8080 y BFF en http://localhost:3000/api/v1
# Requiere un archivo .env (copiar desde .env.example) con las claves del proyecto Supabase.
services:
  api:
    build:
      context: .
      target: api
    env_file: .env
    ports:
      - '3000:3000'
    healthcheck:
      test: ['CMD', 'wget', '-qO-', 'http://localhost:3000/api/v1/health']
      interval: 30s
      timeout: 5s
      retries: 3
    restart: unless-stopped

  web:
    build:
      context: .
      target: web
    depends_on:
      - api
    ports:
      - '8080:80'
    restart: unless-stopped
